name: lexnland
description: LexNLand - Buy & Sell Plots (unified)

publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  http: ^1.1.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  image_picker: ^1.2.3
  record: ^6.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  razorpay_flutter: ^1.3.7
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo_small.png
    - assets/images/logo_small_white.png
    - assets/images/logo_large.png
    - assets/images/logo.svg
